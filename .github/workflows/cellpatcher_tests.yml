name: Test Suite

# CellPatcher's own CI. This file is not part of the LabConstrictor template: the template's
# .template_sync migrations write only the files they name, so a template sync leaves it alone
# (docs/developer_notes.md, "LabConstrictor template"). The template's own tests.yml runs only in
# the template repository; this file has another name so that the two never meet.
# tests/test_ci_workflow.py checks the jobs below.

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  rules:
    # The code standards (design v0.4 §9): the shared code rules and Ruff, against their
    # shrink-only baseline (tools/code_rules_baseline.json).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install "ruff==0.17.3"

      - name: Code rules
        run: python tools/check.py --rules

  spec-pin:
    # The vendored Spec test material (tests/spec_fixtures, docs/vendoring.md of the Spec) must be what the
    # Spec has at the commit PIN.toml names: vendor.py --check changes nothing and names each difference.
    # tests/test_spec_pin.py proves offline that the copy hashes to PIN.toml; this job proves PIN.toml.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out the Spec (full history, to find the pinned commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CellMigrationLab/MorphoBricks-Spec
          path: spec
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: The vendored copy is the Spec at its pinned commit
        run: python spec/tools/vendor.py --into . --check

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Without and with the optional zarr extra (OME-Zarr images), whose tests
        # skip when it is not installed; the notebook's tests (its pages and a run
        # of the notebook file in a kernel) need the notebook extra.
        extras: ['test', 'test,zarr', 'test,zarr,notebook']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest -q

  pytest-torch:
    # Every extra plus CPU torch: the torch tests (torch_dataset, torch_session, the torch
    # tests of delivery and biological_repeat) and the PyTorch notebook's kernel run, which
    # skip without torch. torch is pinned and comes from the CPU wheel index (no CUDA
    # download). Nothing may skip here: a skip means a test this job exists for did not run.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TORCH_VERSION: '2.15.0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install CPU torch, then the package + test, zarr and notebook extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,zarr,notebook]"
          python -c "import torch; assert torch.__version__.split('+')[0] == '${TORCH_VERSION}', torch.__version__; print('torch', torch.__version__)"

      - name: Run tests (no skips allowed)
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then
            echo "::error title=Skipped tests in the torch job::every test must run with all extras and CPU torch (see the skip reasons above)"
            exit 1
          fi
