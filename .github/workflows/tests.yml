name: Test Suite

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Without and with the optional preprocessing extra, whose tests
        # skip when it is not installed.
        extras: ['test', 'test,preprocessing']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest -q
