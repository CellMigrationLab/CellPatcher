name: Test Suite

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  rules:
    # The code standards (design v0.4 §9): the shared code rules and Ruff, against their
    # shrink-only baseline (tools/code_rules_baseline.json).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install "ruff==0.17.3"

      - name: Code rules
        run: python tools/check.py --rules

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Without and with the optional zarr extra (OME-Zarr images), whose tests
        # skip when it is not installed.
        extras: ['test', 'test,zarr']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest -q
