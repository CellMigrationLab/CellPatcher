name: Update documentation figures

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**/*.py'
      - 'tests/fixtures/*.tif'
      - '.tools/python/generate_docs_figures.py'
      - '.github/workflows/update_docs_figures.yml'
  workflow_dispatch:

# Share the lock with the other auto-committing workflows so their pushes
# never race each other.
concurrency:
  group: notebooks-global-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-figures:
    name: Regenerate docs/assets figures
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the branch tip (not the triggering commit) so a commit
          # pushed by a workflow that ran earlier in the lock is included.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and plotting dependency
        run: |
          python -m pip install --upgrade pip
          # matplotlib is pinned to the notebook environment's version so the
          # rendered PNGs only change when the figures actually change.
          python -m pip install -e . matplotlib==3.10.8

      - name: Generate figures
        run: python .tools/python/generate_docs_figures.py

      - name: Commit updated figures
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: GitHub Action - Updated documentation figures
          file_pattern: docs/assets/*.png
