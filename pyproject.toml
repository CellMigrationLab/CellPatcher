# Tool settings only: the package is built from setup.py (no [build-system] table, so pip
# keeps using setuptools as before).

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]
# The vendored Spec files are byte-exact copies (tests/spec_fixtures/README.md).
extend-exclude = ["tests/guard_fixtures", "tests/spec_fixtures", "references", ".tools", "app"]

[tool.ruff.lint]
# The MorphoBricks code standards (design v0.4 §9), as in morphobricks-preprocessing. Findings
# that existed when they were adopted are in the baseline (tools/check.py); new code complies.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # modern syntax for the target Python
    "NPY", # numpy-specific checks
    "D",   # docstrings
    "C90", # complexity (spec §9: at most 15)
    "PLR0913", # at most 8 parameters
    "PLR0915", # at most 50 statements
    "ANN", # complete annotations
    "PGH004", # a noqa names its rules, so the noqa ratchet sees every one
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50

[tool.ruff.lint.isort]
known-first-party = ["cellpatcher", "code_rules", "check"]
# Spec §9: annotations come with postponed evaluation (I002 enforces it).
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from the annotation and docstring rules (owner decision, 1 November 2026).
"tests/**" = ["D", "ANN", "I002"]
"notebooks/**" = ["I002"]  # notebook cells are not modules

[tool.morphobricks.code-rules]
# The shared tools/code_rules.py (spec §9), configured for this repository.
owner = "cellpatcher"
package = "src/cellpatcher"
baseline = "tools/code_rules_baseline.json"

[tool.morphobricks.code-rules.layers]
# pure: no I/O, no UI; io: reads or writes files; ui: notebook and command line, no
# computing; orchestration: ties the others together.
"cellpatcher" = "orchestration"
"cellpatcher._deprecation" = "pure"
"cellpatcher.axes" = "pure"
